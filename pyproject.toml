[project]
name = "agent-smith"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "docker>=7",
    "google-genai",
    "mcp[cli]>=1.22,<2",
    "openai>=3.46.0",
    "pydantic>=2",
    "tiktoken>=0.12",
]

[project.scripts]
sandbox = "src.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
dev-mode-dirs = ["."]
